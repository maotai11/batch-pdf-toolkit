<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch PDF Toolkit - 離線 PDF 批量處理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 260px 1fr 320px;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            gap: 0;
        }

        /* 頂部工具列 */
        .toolbar {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .toolbar h1 {
            font-size: 20px;
            font-weight: 600;
            margin-right: auto;
        }

        .toolbar button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }

        .toolbar button:active {
            transform: translateY(0);
        }

        .toolbar .btn-primary {
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .toolbar .btn-primary:hover {
            background: #f0f0f0;
        }

        /* 左側檔案列表 */
        .file-list {
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-list-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
        }

        .file-list-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
        }

        .file-upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .file-upload-area:hover {
            border-color: #667eea;
            background: #f9f9ff;
        }

        .file-upload-area.drag-over {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .file-items {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .file-item {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-item:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .file-item.active {
            background: #e8ebff;
            border-color: #667eea;
        }

        .file-item-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-item-info {
            font-size: 11px;
            color: #888;
        }

        /* 中央畫布區域 */
        .canvas-area {
            background: #e8e8e8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .canvas-toolbar {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            gap: 5px;
            padding: 5px;
            background: #f9f9f9;
            border-radius: 6px;
        }

        .tool-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .tool-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            padding: 20px;
        }

        #main-canvas {
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 100%;
            max-height: 100%;
        }

        .page-thumbnails {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 10px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            max-height: 150px;
        }

        .thumbnail {
            min-width: 80px;
            height: 100px;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            background: white;
            transition: all 0.2s;
        }

        .thumbnail:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .thumbnail.active {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .thumbnail canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .thumbnail-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            text-align: center;
        }

        /* 右側屬性面板 */
        .properties-panel {
            background: white;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            border-bottom: 1px solid #e0e0e0;
            padding: 15px;
        }

        .panel-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #666;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .form-group input[type="range"] {
            width: 100%;
        }

        .quality-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            font-size: 12px;
            color: #888;
        }

        .variable-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }

        .var-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .var-btn:hover {
            background: #e0e0e0;
            border-color: #667eea;
        }

        .naming-preview {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 10px;
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

        .naming-preview-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .naming-preview-example {
            font-family: 'Courier New', monospace;
            color: #667eea;
        }

        .batch-operations {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .batch-btn {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .batch-btn:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        /* 進度條 */
        .progress-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 15px 20px;
            min-width: 300px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-text {
            font-size: 13px;
            margin-bottom: 8px;
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        /* 滾動條樣式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        /* 響應式 */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 200px 1fr 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部工具列 -->
        <div class="toolbar">
            <h1>📄 Batch PDF Toolkit</h1>
            <button id="btn-clear-all">清空全部</button>
            <button id="btn-export" class="btn-primary">匯出 PDF</button>
        </div>

        <!-- 左側檔案列表 -->
        <div class="file-list">
            <div class="file-list-header">
                <h2>檔案列表</h2>
                <div class="file-upload-area" id="upload-area">
                    <input type="file" id="file-input" accept=".pdf" multiple style="display: none;">
                    <div>📁 拖曳 PDF 檔案至此</div>
                    <div style="font-size: 12px; color: #888; margin-top: 5px;">或點擊選擇檔案</div>
                </div>
            </div>
            <div class="file-items" id="file-items">
                <!-- 動態生成檔案項目 -->
            </div>
        </div>

        <!-- 中央畫布區域 -->
        <div class="canvas-area">
            <div class="canvas-toolbar">
                <div class="tool-group">
                    <button class="tool-btn" id="btn-rotate-left" title="逆時針旋轉">↶ 左轉</button>
                    <button class="tool-btn" id="btn-rotate-right" title="順時針旋轉">↷ 右轉</button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" id="btn-crop" title="裁切">✂ 裁切</button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" id="btn-text" title="添加文字">T 文字</button>
                    <button class="tool-btn" id="btn-rect" title="添加矩形">□ 矩形</button>
                    <button class="tool-btn" id="btn-circle" title="添加圓形">○ 圓形</button>
                </div>
                <div class="tool-group">
                    <button class="tool-btn" id="btn-delete" title="刪除選取">🗑 刪除</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="main-canvas"></canvas>
            </div>
            <div class="page-thumbnails" id="page-thumbnails">
                <!-- 動態生成頁面縮圖 -->
            </div>
        </div>

        <!-- 右側屬性面板 -->
        <div class="properties-panel">
            <!-- 匯出設定 -->
            <div class="panel-section">
                <h3>⚙️ 匯出設定</h3>
                <div class="form-group">
                    <label>壓縮品質 (JPEG)</label>
                    <input type="range" id="quality-slider" min="10" max="100" value="85" step="5">
                    <div class="quality-display">
                        <span>品質: <strong id="quality-value">85</strong>%</span>
                        <span id="quality-hint">建議值</span>
                    </div>
                </div>
            </div>

            <!-- 命名規則 -->
            <div class="panel-section">
                <h3>📝 命名規則</h3>
                <div class="form-group">
                    <label>檔案名稱格式</label>
                    <input type="text" id="naming-rule" value="{原始檔名}-{頁碼}" placeholder="輸入命名規則">
                    <div class="variable-buttons">
                        <button class="var-btn" data-var="{原始檔名}">原始檔名</button>
                        <button class="var-btn" data-var="{頁碼}">頁碼</button>
                        <button class="var-btn" data-var="{流水號}">流水號</button>
                        <button class="var-btn" data-var="{日期}">日期</button>
                        <button class="var-btn" data-var="{時間}">時間</button>
                    </div>
                </div>
                <div class="naming-preview">
                    <div class="naming-preview-title">預覽範例：</div>
                    <div class="naming-preview-example" id="naming-preview">報告-1.pdf, 報告-2.pdf</div>
                </div>
            </div>

            <!-- 批量操作 -->
            <div class="panel-section">
                <h3>🔄 批量操作</h3>
                <div class="batch-operations">
                    <button class="batch-btn" id="btn-batch-rotate">旋轉全部頁面</button>
                    <button class="batch-btn" id="btn-batch-merge">合併全部 PDF</button>
                    <button class="batch-btn" id="btn-batch-split">拆分為單頁</button>
                    <button class="batch-btn" id="btn-batch-extract">擷取特定頁面</button>
                </div>
            </div>

            <!-- 頁面資訊 -->
            <div class="panel-section">
                <h3>ℹ️ 頁面資訊</h3>
                <div class="form-group">
                    <label>當前頁面</label>
                    <input type="text" id="current-page-info" value="未載入" readonly>
                </div>
                <div class="form-group">
                    <label>總頁數</label>
                    <input type="text" id="total-pages-info" value="0" readonly>
                </div>
                <div class="form-group">
                    <label>檔案大小</label>
                    <input type="text" id="file-size-info" value="-" readonly>
                </div>
            </div>
        </div>
    </div>

    <!-- 進度條 -->
    <div class="progress-container" id="progress-container">
        <div class="progress-text" id="progress-text">處理中...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- 載入外部庫 -->
    <script src="lib/pdf.min.js"></script>
    <script src="lib/fabric.min.js"></script>
    <script src="lib/html2canvas.min.js"></script>
    <script src="lib/pdf-lib.min.js"></script>

    <!-- 載入應用模組 -->
    <script type="module" src="js/pdfLoader.js"></script>
    <script type="module" src="js/canvasManager.js"></script>
    <script type="module" src="js/batchProcessor.js"></script>
    <script type="module" src="js/pdfExporter.js"></script>
    <script type="module" src="js/uiController.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
